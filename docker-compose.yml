services:
  # Реляционная база данных справочника топлив.
  heat-postgres:
    image: postgres:17
    container_name: heat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heat}
      POSTGRES_DB: ${POSTGRES_DB:-heat_fuels}
    ports:
      - "5434:5432"   # 5432 и 5433 на хосте заняты другими установками PostgreSQL
    volumes:
      - heat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heat} -d ${POSTGRES_DB:-heat_fuels}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Панель администратора БД: просмотр таблиц и выполнение select/update вручную.
  heat-adminer:
    image: adminer:latest
    container_name: heat-adminer
    depends_on:
      heat-postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: heat-postgres
    ports:
      - "8081:8080"   # http://localhost:8081

  # Объектное хранилище изображений и коротких видео для карточек топлива.
  heat-minio:
    image: minio/minio:latest
    container_name: heat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API, отсюда шаблоны берут изображения и видео
      - "9001:9001"   # веб-консоль Minio
    volumes:
      - heat-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Разовая инициализация: создаёт бакет и открывает его на публичное чтение.
  # Все изображения и видео должны загружаться в MinIO вручную или через
  # отдельный процесс публикации; локальные файлы проекта больше не участвуют.
  heat-minio-init:
    image: minio/mc:latest
    container_name: heat-minio-init
    depends_on:
      heat-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set heat http://heat-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing heat/heat-fuel-media;
      mc anonymous set download heat/heat-fuel-media;
      mc ls heat/heat-fuel-media;
      "

volumes:
  heat-minio-data:
  heat-postgres-data:
